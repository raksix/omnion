# PostgreSQL — Omnion's primary datastore.
services:
  postgres:
    image: postgres:17-alpine
    container_name: omnion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${OMNION_DB_USER:-omnion}
      POSTGRES_PASSWORD: ${OMNION_DB_PASSWORD:-omnion}
      POSTGRES_DB: ${OMNION_DB_NAME:-omnion}
    ports:
      - "${OMNION_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${OMNION_DB_USER:-omnion} -d ${OMNION_DB_NAME:-omnion}
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
