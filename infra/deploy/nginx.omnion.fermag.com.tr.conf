# Omnion — live development deployment (omnion.fermag.com.tr)
# Panel: omnion.fermag.com.tr · Public renderer: demo.omnion.fermag.com.tr · API: 127.0.0.1:4180 (internal)

upstream omnion_live_admin { server 127.0.0.1:3180; }
upstream omnion_live_web   { server 127.0.0.1:3280; }
upstream omnion_live_api   { server 127.0.0.1:4180; }

# ---------------------------------------------------------------- HTTP (ACME + redirect)

server {
    listen 80;
    listen [::]:80;
    server_name omnion.fermag.com.tr demo.omnion.fermag.com.tr;
    client_max_body_size 25m;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- Panel (HTTPS)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name omnion.fermag.com.tr;
    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/omnion.fermag.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnion.fermag.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /healthz { proxy_pass http://omnion_live_api/healthz; proxy_set_header Host $host; }
    location = /readyz  { proxy_pass http://omnion_live_api/readyz;  proxy_set_header Host $host; }

    location / {
        proxy_pass http://omnion_live_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------------------------------------------------------------- Public renderer (HTTPS)

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.omnion.fermag.com.tr;
    client_max_body_size 25m;

    ssl_certificate     /etc/letsencrypt/live/omnion.fermag.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/omnion.fermag.com.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://omnion_live_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
