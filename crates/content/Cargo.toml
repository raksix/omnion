[package]
name = "omnion-content"
description = "Omnion content: pages, their revision history and translation rows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rand.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
tokio.workspace = true

# Argon2id password hashing for visitor accounts (REQ-064, slice 4c). The dependency is on the
# identity crate rather than on `argon2` directly, deliberately: the point of reusing it is that
# a member's credential costs exactly what a user's costs, and duplicating the PHC plumbing here
# is how the two drift into different parameters. Identity does not depend on content, so this
# is not a cycle.
omnion-identity = { path = "../identity" }
