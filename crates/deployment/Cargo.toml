[package]
name = "omnion-deployment"
description = "Omnion deployment centre: version and channel rules, release metadata, pre-flight checks and the deployment job model."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `macros` is for one `format_description!`: a feed entry may carry a datetime with no offset,
# which no well-known description reads, and hand-assembling a FormatDescription for a single
# layout costs more lines than the feature does.
time = { workspace = true, features = ["macros"] }
thiserror.workspace = true
uuid.workspace = true
