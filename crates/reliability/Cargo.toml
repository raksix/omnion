[package]
name = "omnion-reliability"
description = "Omnion reliability primitives: idempotency keys, retry policies, platform rate limits, outbound circuit breakers and the inbound intake guard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
hex.workspace = true
# HMAC verification for the intake guard and the signature-id replay defence.
hmac.workspace = true
sha2.workspace = true
subtle = "2"
# The limiter's counter. `omnion-core` owns the Redis handle so the budget borrows it rather
# than opening a second pool; a path dependency like every other intra-workspace edge.
omnion-core = { path = "../core" }
rand.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
