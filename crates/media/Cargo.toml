[package]
name = "omnion-media"
description = "Omnion media: the media library rows behind the object storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
image.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Share links (REQ-010 slice 3) mint their bearer token from the OS CSPRNG here rather than in
# the route, so the width and the source cannot drift apart.
rand.workspace = true
sqlx.workspace = true
thiserror.workspace = true
# `formatting`/`parsing` for the `HTTP-date` spellings and `macros` for the tests' fixtures. The
# conditional-request validator renders and re-reads a date in every spelling RFC 9110 requires a
# recipient to accept, so the workspace default (serde only) is not enough here.
time = { workspace = true, features = ["formatting", "parsing", "macros"] }
tracing.workspace = true
uuid.workspace = true
