[package]
name = "omnion-core"
description = "Omnion core: shared infrastructure primitives for every Omnion application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Web Push (REQ-021 slice 6): the JWT signature over a push request. `vapid` needs no HTTP
# client and no mail stack, which is what makes it fit in core; the encrypted body
# (`push_crypto`) belongs in the notification crate beside the transport that sends it.
hmac.workspace = true
p256.workspace = true
sha2.workspace = true
getrandom = "0.2"

tokio.workspace = true
sqlx.workspace = true
redis.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
