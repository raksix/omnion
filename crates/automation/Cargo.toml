[package]
name = "omnion-automation"
description = "Omnion automation: event-triggered rules (trigger → condition → action) on the durable step engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The outbound `http_request` action signs every call with HMAC-SHA256 (the rule's key
# over the timestamp, method, path and body hash) and verifies one in constant time, so a
# receiver has a reference implementation rather than a description of the scheme.
hmac.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
omnion-audit = { path = "../audit" }
omnion-content = { path = "../content" }
omnion-events = { path = "../events" }
omnion-workflows = { path = "../workflows" }
