[package]
name = "omnion-identity"
description = "Omnion identity: users, password hashing and server-side sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true

# TOTP (RFC 6238) needs HMAC over SHA-1 — the RFC's PRF and what authenticator apps implement.
# Secret envelopes are encrypt-then-MAC with HMAC-SHA256 (crates/identity/src/secrets.rs).
hmac = "0.12"
sha1 = "0.10"
subtle = "2"

# WebAuthn (REQ-006, slice 3b): base64url for the ceremony's wire strings, and the two
# signature families a passkey carries (ES256 via p256, EdDSA via ed25519-dalek).
base64.workspace = true
p256.workspace = true
ed25519-dalek.workspace = true

# Enterprise sign-in (REQ-006, slice 4b-2): the OIDC/OAuth2 token exchange and discovery fetch, and
# the RS256 verification of an ID token. The identity crate reaches the network only here — every
# other sign-in path is local. `xmltree` is the SAML assertion reader (it parses into a tree, but
# the signature is verified over the exact posted bytes, which this module keeps).
reqwest = { workspace = true, features = ["json"] }
rsa.workspace = true
url.workspace = true
xmltree = "0.11"
regex = "1.13.1"

# Directory providers (REQ-065, slice 4 part 14): `ldaps://` and StartTLS need a TLS stack the
# rest of the crate does not use, because `reqwest` is a client for framed HTTP messages and an
# LDAP connection is a raw byte stream the platform negotiates itself. These are the same
# versions the workspace already resolves for `reqwest`, so nothing new enters the build graph.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
