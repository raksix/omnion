[package]
name = "omnion-identity"
description = "Omnion identity: users, password hashing and server-side sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true

# TOTP (RFC 6238) needs HMAC over SHA-1 — the RFC's PRF and what authenticator apps implement.
# Secret envelopes are encrypt-then-MAC with HMAC-SHA256 (crates/identity/src/secrets.rs).
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
