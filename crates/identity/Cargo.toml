[package]
name = "omnion-identity"
description = "Omnion identity: users, password hashing and server-side sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
tokio.workspace = true
sqlx.workspace = true
thiserror.workspace = true
uuid.workspace = true
time.workspace = true
serde_json.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
tracing.workspace = true

# The enforced brute-force thresholds (REQ-012, slice 3). `omnion-security` owns the lockout
# document `/security/sign-in-protection` edits, and it depends on nothing in this crate — so the
# edge runs this way and not the other. Before it, this crate carried its own copy of the
# thresholds against `security_policies`, the one document of the two that nothing on the request
# path read.
omnion-security = { path = "../security" }

# TOTP (RFC 6238) needs HMAC over SHA-1 — the RFC's PRF and what authenticator apps implement.
# Secret envelopes are encrypt-then-MAC with HMAC-SHA256 (crates/identity/src/secrets.rs).
hmac = "0.12"
sha1 = "0.10"
subtle = "2"

# WebAuthn (REQ-006, slice 3b): base64url for the ceremony's wire strings, and the two
# signature families a passkey carries (ES256 via p256, EdDSA via ed25519-dalek).
base64.workspace = true
p256.workspace = true
ed25519-dalek.workspace = true

# Enterprise sign-in (REQ-006, slice 4b-2): the OIDC/OAuth2 token exchange and discovery fetch, and
# the RS256 verification of an ID token. The identity crate reaches the network only here — every
# other sign-in path is local. `xmltree` is the SAML assertion reader (it parses into a tree, but
# the signature is verified over the exact posted bytes, which this module keeps).
reqwest = { workspace = true, features = ["json"] }
rsa.workspace = true
url.workspace = true
xmltree = "0.11"
