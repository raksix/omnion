[package]
name = "omnion-notifications"
description = "Omnion notifications: the in-app record, its per-user matrix and its delivery queue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
# The router resolves a `permission:` recipient rule through the *same* resolution the route
# guard uses, so a rule can never reach somebody who lost the key and can never miss somebody
# who holds it through role inheritance. One direction only: permissions must not know about
# notifications, or a permission check would start emitting.
omnion-permissions = { path = "../permissions" }
omnion-events = { path = "../events" }
omnion-backup = { path = "../backup" }
omnion-audit = { path = "../audit" }
