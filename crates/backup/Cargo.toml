[package]
name = "omnion-backup"
description = "Omnion backup centre: parts, manifests, verification and retention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# A backup is a promise about bytes, so every part carries a SHA-256 and the run carries one
# over its own manifest. `sha2` is the same dependency the media library hashes uploads with,
# on purpose: a checksum that means something else in a different screen is a checksum an
# operator cannot compare by hand.
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

# Archive encryption (slice 4). `aes-gcm` is already the platform's AEAD — Web Push seals
# every notification body with it (crates/core/src/push_crypto.rs) — so a backup archive is
# not the first thing in the product that depends on it. `hkdf` derives the per-artifact key
# from the passphrase; `rand` draws the salt and the nonce from the OS.
aes-gcm.workspace = true
hkdf.workspace = true
rand.workspace = true

# The destination's free space. NOT `libc`: every crate but `omnion-health` is
# `#![forbid(unsafe_code)]`, and `omnion-health` holds the single sanctioned `statvfs` block in
# the whole workspace with a written argument for why the syscall beats shelling out to `df`.
# Reaching past it to call the kernel directly would mean a second `unsafe` in a crate that
# promises it has none; the dependency is the price of that promise, and it is a path
# dependency inside one workspace.
omnion-health = { path = "../health" }

# The media part copies objects rather than counting them, so it has to open the deployment's
# own object store. It depends on the *abstraction* (omnion-storage), never on a vendor SDK:
# a backup that only works against the S3 driver would be a backup that silently stops being a
# backup the day a site is pointed at a directory.
omnion-storage = { path = "../storage" }
time-tz = "2.0.0"
omnion-events = { path = "../events" }
omnion-audit = { path = "../audit" }
