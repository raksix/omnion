  <rect x="36" y="20" width="108" height="12" rx="8px" fill="#1a1a1a" opacity="0.85"/>
  <rect x="530" y="18" width="74" height="16" rx="999" fill="#146c43"/>
  <rect x="36" y="96" width="150" height="9" rx="4" fill="#146c43"/>
