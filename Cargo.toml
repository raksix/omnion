# Omnion — Rust workspace root.
#
# `apps/api` is the HTTP layer only; the real work lives in the crates under `crates/`
# (see docs/04-MONOREPO.md). One repo — but nothing gets entangled.

[workspace]
resolver = "2"
members = [
    "apps/api",
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
