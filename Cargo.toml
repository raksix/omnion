# Omnion — Rust workspace root.
# `apps/api` is the HTTP layer only; the real work lives in the crates under `crates/`
# (see docs/04-MONOREPO.md). One repo — but nothing gets entangled.

[workspace]
resolver = "2"
members = [
    "apps/api",
    "crates/*",
    "modules/*",
    "tools/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Persistence and cache (docs/02-ARCHITECTURE.md: PostgreSQL via SQLx, Redis for cache and
# queues). SQLx features stay explicit so builds pull only what they use.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json", "uuid", "time"] }
redis = { version = "1", default-features = false, features = ["aio", "connection-manager", "tokio-comp"] }

# Observability and error handling.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"

# HTTP middleware plumbing: route guards wrap handlers in the API layer.
tower = { version = "0.5", features = ["util"] }

# Identity primitives (crates/identity): typed ids and timestamps shared with SQLx, Argon2
# password hashing, session-token generation and hashing.
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde-well-known"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# Constant-time comparison. Two callers need it and neither is exotic: the identity
# crate's secret envelope verifies its MAC tag, and the workflows crate's PKCE check
# compares a derived challenge against a provider's — a timing-variable comparison on
# either is a guess oracle rather than a bug.
subtle = "2"

# WebAuthn passkeys (crates/identity): the two signature families a credential can carry —
# ES256 (P-256 ECDSA) and EdDSA (Ed25519). The COSE key and the ceremony blobs are read by the
# crate's own small CBOR reader, so no general CBOR dependency is needed.
p256 = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Enterprise sign-in (crates/identity/src/sso): verifying an OIDC ID token means checking an
# RSASSA-PKCS1-v1_5 signature over the exact bytes a provider sent, so the verification is the
# crate's own rather than a hand-rolled modular exponentiation.
rsa = { version = "0.9", features = ["sha1", "sha2"] }

# Object storage (crates/storage): the S3/MinIO client signs its own requests (SigV4) over a
# plain HTTP client, so the media library needs no vendor SDK.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
hmac = "0.12"
percent-encoding = "2"
bytes = "1"
url = "2"

# The `omnion` command line (tools/cli) reads the first-run password without echoing it.
rpassword = "7"

# Image transformation (crates/media/transform.rs, REQ-010 slice 3): a preset has to *produce*
# pixels, so the platform decodes and re-encodes rather than shelling out to a binary. Only the
# three codecs the presets can emit are pulled in — decoding is the same set the header probe
# already understands, so a file the library accepts is a file the transformer can read.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Build cost control. The box has 6 cores and up to seven writers compile at once, so
# the dev profile drops full debuginfo (line tables are enough to read a test failure)
# and dependency crates get a little optimisation. Both cut seconds per build and
# hundreds of megabytes per worktree, and neither affects what the code does.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
