name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust — fmt · clippy · test
    runs-on: ubuntu-latest
    # The dev dependencies of the stack under test (infra/compose/*.yml) — the tests skip
    # themselves when nothing is listening, so the job stays green without them.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omnion
          POSTGRES_PASSWORD: omnion
          POSTGRES_DB: omnion
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U omnion -d omnion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The media suite writes into the same object store the development stack ships. Service
      # containers cannot pass a command, so MinIO is started here the way `infra/compose`
      # starts it; the suite skips itself when no store is listening.
      - name: Start the object store (media library)
        run: |
          docker run -d --name omnion-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=omnion -e MINIO_ROOT_PASSWORD=omnion-dev-secret \
            pgsty/minio:latest server /data
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "the object store did not become healthy" >&2
            docker logs omnion-minio || true
            exit 1
          fi
          echo "object store: $(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/minio/health/live)"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Smoke test (healthz, readyz, identity flow)
        env:
          # Seeds the first administrator on the freshly migrated CI database.
          OMNION_ADMIN_EMAIL: admin@example.com
          OMNION_ADMIN_PASSWORD: smoke-test-admin-password
        run: |
          cargo build -p omnion-api -p omnion-cli
          ./target/debug/omnion-api &
          API_PID=$!
          healthy=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then healthy=1; break; fi
            sleep 1
          done
          if [ "$healthy" != "1" ]; then
            echo "API did not become healthy" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/readyz
          echo
          # Identity: the bootstrapped account signs in, reads /me and signs out again.
          curl -fsS -c /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"smoke-test-admin-password"}' \
            http://127.0.0.1:8080/api/v1/auth/login
          echo
          curl -fsS -b /tmp/omnion-cookies.txt http://127.0.0.1:8080/api/v1/me
          echo
          anonymous=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/me)
          if [ "$anonymous" != "401" ]; then
            echo "anonymous /me must be rejected with 401, got $anonymous" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          # IAM: the bootstrapped administrator is the Owner, so the gated surface answers …
          curl -fsS -b /tmp/omnion-cookies.txt http://127.0.0.1:8080/api/v1/iam/roles
          echo
          curl -fsS -b /tmp/omnion-cookies.txt 'http://127.0.0.1:8080/api/v1/iam/effective-permissions' | head -c 300
          echo
          # … while the same routes stay closed without a session.
          for route in /api/v1/iam/roles /api/v1/iam/audit; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")
            if [ "$code" != "401" ]; then
              echo "anonymous $route must be rejected with 401, got $code" >&2
              kill "$API_PID" 2>/dev/null || true
              exit 1
            fi
          done
          # Tenancy: the Owner opens a tenant, a site inside it and a domain on that site.
          curl -fsS -b /tmp/omnion-cookies.txt http://127.0.0.1:8080/api/v1/organizations
          echo
          org_id=$(curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d '{"name":"Smoke Organization","slug":"smoke-organization"}' \
            http://127.0.0.1:8080/api/v1/organizations | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          site_id=$(curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d "{\"organization_id\":\"$org_id\",\"key\":\"main\",\"name\":\"Main Site\"}" \
            http://127.0.0.1:8080/api/v1/sites | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d '{"host":"smoke.omnion.test"}' \
            "http://127.0.0.1:8080/api/v1/sites/$site_id/domains"
          echo
          # … and the same tenancy routes stay closed without a session.
          for route in /api/v1/organizations /api/v1/sites; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")
            if [ "$code" != "401" ]; then
              echo "anonymous $route must be rejected with 401, got $code" >&2
              kill "$API_PID" 2>/dev/null || true
              exit 1
            fi
          done
          # Content: the Owner drafts a page, publishes it, revises it and restores the first
          # revision — the history survives and nothing is rewritten.
          page_id=$(curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d "{\"site_id\":\"$site_id\",\"slug\":\"home\",\"title\":\"Welcome\"}" \
            http://127.0.0.1:8080/api/v1/pages | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          first_revision=$(curl -fsS -b /tmp/omnion-cookies.txt \
            "http://127.0.0.1:8080/api/v1/pages/$page_id/revisions" | python3 -c 'import json,sys; print(json.load(sys.stdin)["revisions"][0]["id"])')
          curl -fsS -b /tmp/omnion-cookies.txt -X POST \
            "http://127.0.0.1:8080/api/v1/pages/$page_id/publish" | head -c 220
          echo
          curl -fsS -b /tmp/omnion-cookies.txt -X PATCH -H 'content-type: application/json' \
            -d '{"title":"Welcome to Omnion"}' \
            "http://127.0.0.1:8080/api/v1/pages/$page_id" | head -c 220
          echo
          curl -fsS -b /tmp/omnion-cookies.txt -X POST \
            "http://127.0.0.1:8080/api/v1/pages/$page_id/publish" >/dev/null
          curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d "{\"revision_id\":\"$first_revision\"}" \
            "http://127.0.0.1:8080/api/v1/pages/$page_id/restore" | head -c 220
          echo
          curl -fsS -b /tmp/omnion-cookies.txt \
            "http://127.0.0.1:8080/api/v1/pages/$page_id/revisions" | head -c 400
          echo
          curl -fsS -b /tmp/omnion-cookies.txt -X PUT -H 'content-type: application/json' \
            -d '{"title":"Merhaba"}' \
            "http://127.0.0.1:8080/api/v1/pages/$page_id/revisions/$first_revision/translations/tr" | head -c 220
          echo
          # … and the content routes stay closed without a session.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/api/v1/pages?site_id=$site_id")
          if [ "$code" != "401" ]; then
            echo "anonymous /api/v1/pages must be rejected with 401, got $code" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          # Public surface: the site renderer reads published content without any session, the
          # site resolves by key and by its own domain, and drafts stay private.
          public_title=$(curl -fsS "http://127.0.0.1:8080/api/v1/public/pages/home?site=main" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"]["title"])')
          if [ "$public_title" != "Welcome to Omnion" ]; then
            echo "the public read must serve the published revision, got $public_title" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          host_title=$(curl -fsS -H 'Host: smoke.omnion.test' \
            http://127.0.0.1:8080/api/v1/public/pages/home \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["revision"]["title"])')
          if [ "$host_title" != "Welcome to Omnion" ]; then
            echo "the site's own domain must resolve the request, got $host_title" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d "{\"site_id\":\"$site_id\",\"slug\":\"unpublished\",\"title\":\"Not yet\"}" \
            http://127.0.0.1:8080/api/v1/pages >/dev/null
          draft_code=$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/api/v1/public/pages/unpublished)
          if [ "$draft_code" != "404" ]; then
            echo "an unpublished page must answer 404 on the public surface, got $draft_code" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          echo "public surface: title=\"$public_title\" via-key · \"$host_title\" via-domain · unpublished=$draft_code"
          # Media: the Owner uploads a file into the site's library, reads it back through both
          # read paths, lists it, and removes it again — the round trip the media surface exists
          # for (docs/BUILD-BACKLOG.md P08).
          printf 'omnion media smoke\n' > /tmp/omnion-media.txt
          media_id=$(curl -fsS -b /tmp/omnion-cookies.txt \
            -F 'file=@/tmp/omnion-media.txt;type=text/plain' \
            "http://127.0.0.1:8080/api/v1/media?site_id=$site_id" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          library=$(curl -fsS -b /tmp/omnion-cookies.txt \
            "http://127.0.0.1:8080/api/v1/media?site_id=$site_id" \
            | python3 -c 'import json,sys; rows=json.load(sys.stdin)["media"]; first=rows[0]; print(len(rows), "file(s), first=" + first["filename"], first["size_bytes"], "B", first["content_type"])')
          curl -fsS -b /tmp/omnion-cookies.txt -o /tmp/omnion-media-raw.bin \
            "http://127.0.0.1:8080/api/v1/media/$media_id/raw"
          cmp /tmp/omnion-media.txt /tmp/omnion-media-raw.bin
          curl -fsS -o /tmp/omnion-media-public.bin \
            "http://127.0.0.1:8080/api/v1/public/media/$media_id"
          cmp /tmp/omnion-media.txt /tmp/omnion-media-public.bin
          media_type=$(curl -s -o /dev/null -w '%{content_type}' \
            "http://127.0.0.1:8080/api/v1/public/media/$media_id")
          if [ "$media_type" != "text/plain" ]; then
            echo "the served media must keep its content type, got $media_type" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          media_code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080/api/v1/media?site_id=$site_id")
          if [ "$media_code" != "401" ]; then
            echo "anonymous /api/v1/media must be rejected with 401, got $media_code" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS -o /dev/null -X DELETE -b /tmp/omnion-cookies.txt \
            "http://127.0.0.1:8080/api/v1/media/$media_id"
          removed=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/omnion-cookies.txt \
            "http://127.0.0.1:8080/api/v1/media/$media_id/raw")
          if [ "$removed" != "404" ]; then
            echo "a removed file must answer 404 on the panel read path, got $removed" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          echo "media surface: library=$library · round-trip=ok · public=ok · removed=$removed"
          # Workflows: the Owner defines a four-step workflow whose middle step fails once, runs
          # it, and the runner inside the API retries the failure, parks on the wait step and
          # finishes the run (docs/BUILD-BACKLOG.md P09).
          workflow_steps='{"name":"Smoke workflow","organization_id":"'"$org_id"'","trigger":{"kind":"manual"},"steps":[{"name":"prepare","kind":"task","action":"noop"},{"name":"unstable","kind":"task","action":"transient","params":{"fail_times":1},"max_attempts":3},{"name":"pause","kind":"wait","params":{"seconds":1}},{"name":"finish","kind":"task","action":"echo","params":{"value":"done"}}]}'
          workflow_id=$(curl -fsS -b /tmp/omnion-cookies.txt -H 'content-type: application/json' \
            -d "$workflow_steps" http://127.0.0.1:8080/api/v1/workflows \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          execution_id=$(curl -fsS -b /tmp/omnion-cookies.txt -X POST \
            "http://127.0.0.1:8080/api/v1/workflows/$workflow_id/run" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          workflow_state=""
          for _ in $(seq 1 60); do
            workflow_state=$(curl -fsS -b /tmp/omnion-cookies.txt \
              "http://127.0.0.1:8080/api/v1/workflow-executions/$execution_id" \
              | python3 -c 'import json,sys; e=json.load(sys.stdin); s=e["steps"]; print(e["status"], "attempts=" + str(s[1]["attempts"]), "wait=" + s[2]["status"])')
            case "$workflow_state" in
              completed*) break ;;
            esac
            sleep 1
          done
          case "$workflow_state" in
            completed\ attempts=2*) ;;
            *)
              echo "the workflow did not settle: $workflow_state" >&2
              kill "$API_PID" 2>/dev/null || true
              exit 1
              ;;
          esac
          curl -fsS -b /tmp/omnion-cookies.txt "http://127.0.0.1:8080/api/v1/iam/audit" \
            | python3 -c 'import json,sys; rows=[r for r in json.load(sys.stdin)["entries"] if r["action"].startswith("workflow.execution.")]; print("workflow audit rows:", len(rows), sorted({r["action"] for r in rows}))'
          workflow_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/workflows)
          if [ "$workflow_code" != "401" ]; then
            echo "anonymous /api/v1/workflows must be rejected with 401, got $workflow_code" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          echo "workflow surface: $workflow_state · run=completed"
          curl -fsS -o /dev/null -X POST -b /tmp/omnion-cookies.txt http://127.0.0.1:8080/api/v1/auth/logout
          kill "$API_PID"

      # The first-run walk (docs/BUILD-BACKLOG.md P10): a database that has never been migrated
      # is set up by the `omnion` CLI — no SQL, no environment bootstrap — and the API then
      # serves it: the wizard is closed, the owner signs in, the site exists with its theme.
      - name: First-run walk (CLI setup on a fresh database)
        env:
          PGPASSWORD: omnion
          OMNION_DATABASE_URL: postgres://omnion:omnion@127.0.0.1:5433/omnion_first_run
        run: |
          set -euo pipefail
          if ! command -v createdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          createdb -h 127.0.0.1 -p 5433 -U omnion omnion_first_run
          # `doctor` on a database this binary has never touched: the schema check fails on
          # purpose — reporting the pending migrations with exit 1 is what `migrate` is for.
          if ./target/debug/omnion doctor; then
            echo "doctor must report the pending schema on an unmigrated database" >&2
            exit 1
          else
            echo "doctor reported the pending schema (exit 1, as expected)"
          fi
          ./target/debug/omnion migrate
          ./target/debug/omnion setup --non-interactive \
            --name 'CI Owner' --email owner@example.com --password 'ci-owner-password-123' \
            --organization 'CI Organization' --site 'CI Site' --domain ci.omnion.test
          ./target/debug/omnion doctor
          # The same installation answers the wizard surface as done …
          OMNION_PORT=8090 ./target/debug/omnion-api > /tmp/omnion-first-run-api.log 2>&1 &
          API_PID=$!
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/readyz >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "the first-run API did not become ready" >&2
            cat /tmp/omnion-first-run-api.log || true
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8090/api/v1/onboarding \
            | python3 -c 'import json,sys; s=json.load(sys.stdin); assert s["completed"] and not s["needs_setup"], s; print("onboarding: completed · steps", s["steps"], "· themes", [t["key"] for t in s["themes"]])'
          # … and the owner the CLI created signs in to a working panel.
          curl -fsS -c /tmp/omnion-first-run-cookies.txt -H 'content-type: application/json' \
            -d '{"email":"owner@example.com","password":"ci-owner-password-123"}' \
            http://127.0.0.1:8090/api/v1/auth/login | head -c 200
          echo
          curl -fsS -b /tmp/omnion-first-run-cookies.txt http://127.0.0.1:8090/api/v1/sites \
            | python3 -c 'import json,sys; sites=json.load(sys.stdin)["sites"]; assert len(sites)==1 and sites[0]["theme"]=="minimal", sites; print("site:", sites[0]["key"], "theme=" + sites[0]["theme"])'
          workflow_code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8090/api/v1/onboarding/complete)
          if [ "$workflow_code" != "401" ]; then
            echo "the setup step must require a session, got $workflow_code" >&2
            kill "$API_PID" 2>/dev/null || true
            exit 1
          fi
          kill "$API_PID"
          echo "first-run surface: CLI setup → completed · owner signs in · site serves theme"

  infra:
    name: Infra — compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate development compose stack
        run: docker compose -f infra/compose/docker-compose.dev.yml config --quiet
