[package]
name = "omnion-module-crm-intake"
description = "Omnion CRM intake: the sources that bind a form or a keyed endpoint to a lead, the mapping that fills it, and the dedupe verdict (docs/requests/REQ-117)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
tracing.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
# `keys::verify_key` is the crate's only credential-checking verb, and it compares two SHA-256
# digests. `subtle` is the constant-time equality the rest of the platform already reaches for
# in the two places it compares a secret itself (`crates/security/src/csrf.rs` and
# `crates/permissions/src/service_accounts.rs`), so this makes the third one a dependency
# rather than a fourth hand-rolled `diff |= a ^ b` loop. Already in the lockfile (2.6.1) — no
# new crate enters the build.
subtle = "2"
# `request_id::scope` is a `tokio::task_local!`, and the reason it is a task-local rather than a
# thread-local is that `tokio::spawn` moves a future between worker threads (see the module docs).
# This is the module's only non-optional tokio dependency.
tokio.workspace = true

[dev-dependencies]
# The slice-2 gate (scripts/qa/run-crm-assignment.sh) needs a real database, because the
# claim's correctness is a property of the *transaction* and no unit test can prove one.
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
