[package]
name = "omnion-api"
description = "Omnion HTTP API (Axum). Thin HTTP layer over the crates in crates/."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# The virus-scanning client (REQ-010, slice 4) posts a file's bytes to a scanner endpoint and
# reads back a verdict. It is a runtime dependency, not a test one: the sweep runs inside a
# request, and a client that only exists under `cfg(test)` would make the pipeline a test-only
# feature.
reqwest = { workspace = true, features = ["json"] }

axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
tower.workspace = true
serde.workspace = true
serde_json.workspace = true
# The list read parses its own query string (see `parse_list_params`): `serde_urlencoded`, which
# backs axum's `Query` extractor, cannot put a repeated key into a `Vec` and answers 400 for
# every category and priority filter.
percent-encoding.workspace = true
sqlx.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true
tokio-stream = { version = "0.1", features = ["sync", "time"] }
omnion-audit = { path = "../../crates/audit" }
omnion-ai-hub = { path = "../../crates/ai-hub" }
omnion-automation = { path = "../../crates/automation" }
omnion-content = { path = "../../crates/content" }
omnion-core = { path = "../../crates/core" }
omnion-events = { path = "../../crates/events" }
# System health (REQ-014). Its own crate rather than a module of the security centre: the
# security centre makes a claim about *safety* and this one about *liveness*, and a
# deployment that could not disable one without the other would be unable to answer
# "who may see that the database is down" separately from "who may see that we have
# findings".
omnion-health = { path = "../../crates/health" }
omnion-identity = { path = "../../crates/identity" }
omnion-backup = { path = "../../crates/backup" }
omnion-media = { path = "../../crates/media" }
omnion-notifications = { path = "../../crates/notifications" }
omnion-security = { path = "../../crates/security" }
omnion-module-analytics = { path = "../../modules/analytics" }
omnion-module-crm = { path = "../../modules/crm" }
omnion-module-accounting = { path = "../../modules/accounting" }
omnion-module-sales = { path = "../../modules/sales" }
omnion-onboarding = { path = "../../crates/onboarding" }
omnion-module-inventory = { path = "../../modules/inventory" }
omnion-module-hr = { path = "../../modules/hr" }
omnion-developer = { path = "../../crates/developer" }
omnion-permissions = { path = "../../crates/permissions" }
omnion-policy-engine = { path = "../../crates/policy-engine" }
omnion-search = { path = "../../crates/search" }
omnion-storage = { path = "../../crates/storage" }
omnion-workflows = { path = "../../crates/workflows" }

# Enterprise sign-in (REQ-006, slice 4b-2): the authorization URL is assembled with a real
# URL parser (so a provider endpoint cannot smuggle a fragment or a second origin into it), and
# the SAML response / Basic client credential travel as base64.
url.workspace = true
base64.workspace = true

[dev-dependencies]
http-body-util = "0.1"
# The passkey integration walk (tests/webauthn.rs) holds the private half of a credential and
# signs the ceremony's own message, so the verification runs exactly as it does in production.
p256.workspace = true
base64.workspace = true
sha2 = "0.10"
rand = "0.8"
# The enterprise sign-in walk (tests/sso_live.rs) runs a *real* identity provider — a loopback
# OIDC/SAML server it starts itself — so the round trip is proven over a socket with real RSA
# signatures rather than against fixtures. `rsa` is already in the tree (the identity crate
# verifies with it); signing with it is what makes the two sides independent.
rsa.workspace = true
time.workspace = true
# The walk plays the *browser*: it fetches the authorization URL the platform redirected to and
# posts the assertion back, so it needs an HTTP client of its own rather than the one the sign-in
# path uses to talk to the provider.
reqwest = { workspace = true, features = ["json"] }
